name: deploy_main

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, linux, docker, front]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build y levantar front
        run: |
          docker compose -f "${COMPOSE_PROJECT_PATH}/dockers/compose.yaml" build --no-cache front
          docker compose -f "${COMPOSE_PROJECT_PATH}/dockers/compose.yaml" up -d front

      - name: Verificar contenedor
        run: docker compose -f "${COMPOSE_PROJECT_PATH}/dockers/compose.yaml" ps front
