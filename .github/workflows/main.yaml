name: deploy_main

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, linux, docker, front]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync al volumen compartido
        run: rsync -a --delete "${GITHUB_WORKSPACE}/" "${COMPOSE_PROJECT_PATH}/src/front/"
