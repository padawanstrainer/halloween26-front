name: deploy_main

on:
  push:
    branches: [main]

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, docker, front]
    steps:
      - name: Checkout main (commit del push)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: Confirmar ref
        run: |
          echo "GITHUB_REF=${{ github.ref }}"
          git log -1 --oneline

      - name: Sync al volumen compartido
        run: |
          mkdir -p "${COMPOSE_PROJECT_PATH}/build/front"
          rsync -rltD --delete \
            --no-owner --no-group --no-perms \
            --exclude '.github' \
            --exclude '.git' \
            "${GITHUB_WORKSPACE}/" "${COMPOSE_PROJECT_PATH}/build/front/"
